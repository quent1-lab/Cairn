[package]
name = "cairn-worldgen"
version.workspace = true
edition.workspace = true

[dependencies]
cairn-core.workspace = true
# Simplex 2D uniquement : les tables de gradients et le skewing sont le genre
# de code subtil et pénible à déboguer qu'on délègue volontiers. Le fBm
# par-dessus, lui, est à nous (src/fbm.rs) : c'est là que sont nos choix.
noise = "0.9"

[dev-dependencies]
# Encodage PNG (DEFLATE) : très au-delà des 50 lignes maison. En
# dev-dependency : seuls les exemples de debug en ont besoin, la lib non.
image.workspace = true
# Parallélise le rendu des cartes de debug (l'humidité coûte ~64 évaluations
# d'altitude par pixel). La lib reste séquentielle : le parallélisme de la
# simulation sera décidé en phase 2, après mesure.
rayon.workspace = true
