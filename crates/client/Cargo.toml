[package]
name = "cairn-client"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cairn-core.workspace = true
cairn-worldgen.workspace = true
cairn-sim.workspace = true

wasm-bindgen = "0.2"
js-sys = "0.3"
# Panics Rust lisibles dans la console du navigateur.
console_error_panic_hook = "0.1"

[dev-dependencies]
# Sert l'exemple `preview` : vérifie nativement le rendu du client en PNG.
image.workspace = true

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "NodeList",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "MouseEvent",
    "WheelEvent",
    "Event",
    "EventTarget",
    "DomRect",
    "CssStyleDeclaration",
    "DomTokenList",
    "Performance",
]
