[package]
name = "cairn-sim"
version.workspace = true
edition.workspace = true

[features]
# Instrumentation du taux d'utilisation des chunks (mesure M1 du chantier de
# performance). Hors de cette feature, le code de mesure n'existe pas dans le
# binaire : un compteur dans `World::tile` serait sur le chemin le plus chaud
# de toute la simulation.
chunk-stats = []
# Profilage par phase du tick : où passe réellement le temps. Hors de cette
# feature, aucun chrono n'existe dans le binaire — ces blocs sont le chemin le
# plus chaud de la simulation.
profile = []
# Télémétrie de la faune : réponse fonctionnelle (prises appariées à la densité
# locale de proies) et fraction de refuge. Hors de cette feature, `FaunaStats`
# est un type vide et ses appels s'évaporent — elle ajoute une boucle sur les
# troupeaux par meute et par tick, ce qui doublerait le coût du tour de meute.
fauna-stats = []

[dependencies]
cairn-core.workspace = true
cairn-worldgen.workspace = true
hecs.workspace = true
serde.workspace = true
ron.workspace = true

[dev-dependencies]
image.workspace = true
rayon.workspace = true
