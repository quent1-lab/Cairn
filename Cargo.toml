[workspace]
resolver = "3"
members = ["crates/core", "crates/worldgen", "crates/sim", "crates/protocol", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
cairn-core = { path = "crates/core" }
cairn-worldgen = { path = "crates/worldgen" }
cairn-sim = { path = "crates/sim" }
cairn-protocol = { path = "crates/protocol" }
noise = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"
# Arbre technologique en données (Phase 5, arbitrage acté avec l'utilisateur) :
# `techs.ron` décrit les techs et leurs prérequis, éditable sans toucher au
# moteur. serde pour le mapping typé, ron pour le format (lisible, commentable,
# supporte enums et structs — mieux que JSON pour de la donnée écrite à la main).
serde = { version = "1", features = ["derive"] }
ron = "0.8"
# ECS minimaliste (Phase 2, arbitrage BRIEF §10.2 acté avec l'utilisateur) :
# stockage d'entités spawn/despawn/requêtes — bien au-delà des ~50 lignes
# maison — sans scheduler imposé : l'ordre des systèmes reste écrit par nous,
# ce qui garantit le déterminisme.
hecs = "0.10"
# Format binaire du protocole (Phase 6, BRIEF §8.4 « postcard ou bincode ») :
# sérialiser une trentaine de types imbriqués à la main est très au-delà des
# ~50 lignes que la règle n°2 met en balance. postcard plutôt que bincode :
# encodage varint (un `u64` de petite valeur tient sur un octet, or le monde
# est en coordonnées i64) et `no_std` — donc le même code sur le fil et dans
# le wasm.
postcard = { version = "1", features = ["use-std"] }
